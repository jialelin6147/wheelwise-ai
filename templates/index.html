<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WheelWise</title><style>body{font:16px system-ui;margin:0;background:#101923;color:#edf3f8}main{max-width:1000px;margin:40px auto;padding:24px}h1{font-size:42px;margin-bottom:4px}p{color:#afbdcc}section{background:#1b2937;padding:24px;border-radius:18px;margin:20px 0}button{background:#b9ef66;color:#142019;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}input{padding:12px;border-radius:8px;max-width:95%}#q{width:70%}a{color:#b9ef66}article{white-space:pre-wrap;padding:15px;border-bottom:1px solid #40505e}#status{color:#b9ef66}li{margin:12px 0}summary{cursor:pointer}</style><main><h1>WheelWise</h1><p>Your tire knowledge, with sources.</p><section><h2>Research library</h2><p>Upload PDF, DOCX, TXT or Markdown. Indexing can take a few minutes.</p><input type="file" id="file" accept=".pdf,.docx,.txt,.md"><button id="upload">Upload & index</button><p id="status" role="status"></p><ul id="files"></ul></section><section><h2>Ask your documents</h2><div id="chat" aria-live="polite"></div><form id="form"><input id="q" placeholder="What does a tire load index mean?" required><button id="send">Ask</button></form><p>Educational document research. Check vehicle-specific approvals with the manufacturer.</p></section></main><script>
let history=[];const $=id=>document.getElementById(id);
async function json(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
async function list(){const fs=await json('/api/files');$('files').replaceChildren();for(const f of fs){const li=document.createElement('li'),a=document.createElement('a'),b=document.createElement('button');a.textContent=f.name;a.href='/api/files/'+f.id;a.target='_blank';a.rel='noopener';b.textContent='Remove';b.style.marginLeft='20px';b.onclick=async()=>{if(confirm('Remove '+f.name+' from your local library?')){await json(a.href,{method:'DELETE'});await list()}};li.append(a,b);$('files').append(li)}}
$('upload').onclick=async()=>{if(!$('file').files[0])return;$('upload').disabled=true;$('status').textContent='Indexing…';try{let f=new FormData();f.append('file',$('file').files[0]);const r=await json('/api/upload',{method:'POST',body:f});$('status').textContent='Ready — '+r.chunks+' passages indexed';await list()}catch(e){$('status').textContent=e.message}finally{$('upload').disabled=false}};
function message(text){let a=document.createElement('article');a.textContent=text;$('chat').append(a);return a}
$('form').onsubmit=async e=>{e.preventDefault();let q=$('q').value;message('You: '+q);$('q').value='';$('send').disabled=true;let a=message('Searching documents…');try{let d=await json('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history})});a.textContent=d.answer;history.push({role:'user',content:q},{role:'assistant',content:d.answer});for(const s of d.sources){let detail=document.createElement('details'),summary=document.createElement('summary'),link=document.createElement('a'),p=document.createElement('p');summary.textContent='['+s.number+'] '+s.name+' • page/section '+s.page;link.href=s.url;link.textContent='Open source';link.target='_blank';link.rel='noopener';p.textContent=s.excerpt;detail.append(summary,link,p);a.append(detail)}}catch(e){a.textContent=e.message}finally{$('send').disabled=false}};list().catch(e=>$('status').textContent=e.message);
</script></html>
